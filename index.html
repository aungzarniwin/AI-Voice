<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N - Gen Voice Studio — Free Native TTS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                            950: '#450a0a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Pyidaungsu & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Pyidaungsu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pyidaungsu', 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(9, 9, 11, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Top Header -->
    <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-rose-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        N - Gen Voice Studio
                        <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-normal">100% Free (No API Key)</span>
                    </h1>
                    <p class="text-xs text-zinc-400">Browser Native Text-to-Speech Engine.</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Script Editor (7 cols) -->
        <section class="lg:col-span-7 flex flex-col space-y-4">
            <div class="glass-panel rounded-2xl p-5 flex-1 flex flex-col shadow-xl">
                <div class="flex items-center justify-between mb-3">
                    <label for="scriptInput" class="text-sm font-semibold text-zinc-200 flex items-center gap-2">
                        <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                        <span>Burmese Script Editor</span>
                    </label>
                    <div class="flex items-center space-x-2">
                        <button onclick="clearText()" class="text-xs px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition">Clear</button>
                        <button onclick="pasteSampleScript()" class="text-xs px-2.5 py-1 rounded-lg bg-brand-500/10 hover:bg-brand-500/20 text-brand-400 border border-brand-500/20 transition">Sample</button>
                    </div>
                </div>

                <div class="relative flex-1 flex flex-col min-h-[340px]">
                    <textarea id="scriptInput" oninput="updateStats()" 
                        class="glass-input w-full flex-1 p-4 rounded-xl text-zinc-100 placeholder-zinc-500 text-base focus:outline-none resize-none leading-relaxed" 
                        placeholder="မြန်မာစာသားများကို ဤနေရာတွင် ထည့်သွင်းပါ..."></textarea>
                </div>

                <!-- Stats Bar -->
                <div class="flex items-center justify-between mt-4 pt-3 border-t border-zinc-800 text-xs text-zinc-400">
                    <div class="flex items-center space-x-4">
                        <span>Characters: <strong id="charCount" class="text-zinc-200">0</strong></span>
                        <span>Words: <strong id="wordCount" class="text-zinc-200">0</strong></span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span>Est. Duration: <strong id="estDuration" class="text-brand-400">0s</strong></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Column: Voice Controls & Player (5 cols) -->
        <section class="lg:col-span-5 flex flex-col space-y-4">
            <div class="glass-panel rounded-2xl p-5 flex flex-col space-y-4 shadow-xl">
                <h3 class="text-sm font-semibold text-zinc-200 flex items-center gap-2 pb-2 border-b border-zinc-800">
                    <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                    </svg>
                    <span>Speech Controls</span>
                </h3>

                <!-- Language / Voice Selector -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-400">Voice / Language Engine</label>
                    <select id="voiceSelect" class="glass-input w-full p-2.5 rounded-xl text-sm text-zinc-200 focus:outline-none">
                        <option value="">Loading system voices...</option>
                    </select>
                </div>

                <!-- Speed Control -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-400">Speed: <span id="speedVal" class="text-brand-400 font-semibold">1.0x</span></label>
                    <div class="grid grid-cols-5 gap-1">
                        <button onclick="setSpeed(0.8)" class="speed-btn py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 hover:border-brand-500 transition">0.8x</button>
                        <button onclick="setSpeed(0.9)" class="speed-btn py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 hover:border-brand-500 transition">0.9x</button>
                        <button onclick="setSpeed(1.0)" class="speed-btn py-1.5 rounded-lg bg-brand-600 border border-brand-500 text-xs text-white font-semibold transition active-speed">1.0x</button>
                        <button onclick="setSpeed(1.1)" class="speed-btn py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 hover:border-brand-500 transition">1.1x</button>
                        <button onclick="setSpeed(1.2)" class="speed-btn py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 hover:border-brand-500 transition">1.2x</button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="playSpeech()" id="playBtn" 
                        class="py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-rose-600 hover:from-brand-500 hover:to-rose-500 text-white font-semibold text-sm shadow-lg shadow-brand-600/30 transition flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span>Play Audio</span>
                    </button>
                    <button onclick="stopSpeech()" 
                        class="py-3 px-4 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold text-sm border border-zinc-700 transition flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10h6v4H9z"></path>
                        </svg>
                        <span>Stop</span>
                    </button>
                </div>

                <!-- Status Feedback -->
                <div id="statusBox" class="hidden p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 flex items-center space-x-3">
                    <div class="w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
                    <span id="statusText">Playing speech...</span>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript Logic -->
    <script>
        let currentSpeed = 1.0;
        let synth = window.speechSynthesis;
        let voices = [];

        function populateVoices() {
            voices = synth.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            voiceSelect.innerHTML = '';
            
            // Filter or sort for Burmese / Multilingual / Default
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.lang.includes('my') || voice.lang.includes('MM')) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            });

            if (voiceSelect.options.length === 0) {
                const option = document.createElement('option');
                option.textContent = 'Default Browser Voice';
                voiceSelect.appendChild(option);
            }
        }

        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoices;
        }

        window.addEventListener('DOMContentLoaded', () => {
            populateVoices();
            updateStats();
        });

        function setSpeed(spd) {
            currentSpeed = spd;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'border-brand-500', 'text-white', 'font-semibold');
                btn.classList.add('bg-zinc-900', 'border-zinc-800', 'text-zinc-300');
                if (btn.textContent.includes(spd + 'x')) {
                    btn.classList.remove('bg-zinc-900', 'border-zinc-800', 'text-zinc-300');
                    btn.classList.add('bg-brand-600', 'border-brand-500', 'text-white', 'font-semibold');
                }
            });
            document.getElementById('speedVal').textContent = spd + 'x';
        }

        function clearText() {
            document.getElementById('scriptInput').value = '';
            updateStats();
        }

        function pasteSampleScript() {
            document.getElementById('scriptInput').value = "မင်္ဂလာပါ၊ N - Gen Voice Studio မှ ကြိုဆိုပါတယ်။ ဤစနစ်သည် ဘရောက်ဆာအတွင်း တိုက်ရိုက်လုပ်ဆောင်သော အခမဲ့ အသံထွက်စနစ် ဖြစ်ပါသည်။";
            updateStats();
        }

        function updateStats() {
            const text = document.getElementById('scriptInput').value;
            const chars = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const estSeconds = Math.round(chars / 14);
            const mins = Math.floor(estSeconds / 60);
            const secs = estSeconds % 60;
            const durationFormatted = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;

            document.getElementById('charCount').textContent = chars.toLocaleString();
            document.getElementById('wordCount').textContent = words.toLocaleString();
            document.getElementById('estDuration').textContent = durationFormatted;
        }

        function showStatus(text) {
            const box = document.getElementById('statusBox');
            const txt = document.getElementById('statusText');
            box.classList.remove('hidden');
            txt.textContent = text;
        }

        function hideStatus() {
            document.getElementById('statusBox').classList.add('hidden');
        }

        function playSpeech() {
            const script = document.getElementById('scriptInput').value.trim();
            if (!script) {
                alert('ကျေးဇူးပြု၍ စာသားထည့်သွင်းပါ။');
                return;
            }

            if (synth.speaking) {
                synth.cancel();
            }

            const utterThis = new SpeechSynthesisUtterance(script);
            const voiceIndex = document.getElementById('voiceSelect').value;
            if (voices[voiceIndex]) {
                utterThis.voice = voices[voiceIndex];
            }
            utterThis.rate = currentSpeed;
            utterThis.pitch = 1.0;

            utterThis.onstart = () => {
                showStatus("Speaking...");
            };

            utterThis.onend = () => {
                hideStatus();
            };

            utterThis.onerror = (event) => {
                hideStatus();
                console.error(event);
                alert('အသံထုတ်လွှင့်ရာတွင် အမှားအယွင်းရှိပါသည်။');
            };

            synth.speak(utterThis);
        }

        function stopSpeech() {
            if (synth.speaking) {
                synth.cancel();
                hideStatus();
            }
        }
    </script>
</body>
</html>
