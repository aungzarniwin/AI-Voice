<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N - Gen Voice Studio — Google AI Studio Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                            950: '#450a0a',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Pyidaungsu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pyidaungsu', 'Inter', sans-serif; }
        .glass-panel { background: rgba(24, 24, 27, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input { background: rgba(9, 9, 11, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-input:focus { border-color: #ef4444; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-rose-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        N - Gen Voice Studio
                        <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20 font-normal">Google AI Studio</span>
                    </h1>
                    <p class="text-xs text-zinc-400">Gemini Voice Personas & Movie Recap Styles.</p>
                </div>
            </div>

            <button onclick="openSettingsModal()" class="flex items-center space-x-2 px-3.5 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-sm font-medium border border-zinc-700 transition">
                <svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756.2924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span>Google AI Key</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Script Editor (7 cols) -->
        <section class="lg:col-span-7 flex flex-col space-y-4">
            <div class="glass-panel rounded-2xl p-5 flex-1 flex flex-col shadow-xl">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-semibold text-zinc-200 flex items-center gap-2">
                        <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                        <span>Movie Recap & Script Editor</span>
                    </label>
                    <div class="flex items-center space-x-2">
                        <button onclick="clearText()" class="text-xs px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300">Clear</button>
                        <button onclick="pasteMovieSample()" class="text-xs px-2.5 py-1 rounded-lg bg-brand-500/10 text-brand-400 border border-brand-500/20">Recap Sample</button>
                    </div>
                </div>

                <textarea id="scriptInput" onupdate="updateStats()" 
                    class="glass-input w-full flex-1 p-4 rounded-xl text-zinc-100 placeholder-zinc-500 text-base focus:outline-none resize-none min-h-[340px]" 
                    placeholder="ရုပ်ရှင်ဇာတ်လမ်း သို့မဟုတ် စာသားများကို ဤနေရာတွင် ရိုက်ထည့်ပါ..."></textarea>

                <div class="flex items-center justify-between mt-4 pt-3 border-t border-zinc-800 text-xs text-zinc-400">
                    <div class="flex space-x-4">
                        <span>Characters: <strong id="charCount" class="text-zinc-200">0</strong></span>
                        <span>Words: <strong id="wordCount" class="text-zinc-200">0</strong></span>
                    </div>
                    <span>Est. Duration: <strong id="estDuration" class="text-brand-400">0s</strong></span>
                </div>
            </div>
        </section>

        <!-- Right Column: Google AI Studio Controls (5 cols) -->
        <section class="lg:col-span-5 flex flex-col space-y-4">
            <div class="glass-panel rounded-2xl p-5 flex flex-col space-y-4 shadow-xl">
                <h3 class="text-sm font-semibold text-zinc-200 pb-2 border-b border-zinc-800 flex items-center gap-2">
                    <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                    </svg>
                    <span>Gemini Voice Personas & Styles</span>
                </h3>

                <!-- Google AI Studio Voice Personas -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-400">AI Voice Persona (အသံအမျိုးအစား)</label>
                    <select id="voicePersonaSelect" class="glass-input w-full p-2.5 rounded-xl text-sm text-zinc-200">
                        <option value="Puck">Puck (Energetic & Dynamic Male)</option>
                        <option value="Charon">Charon (Deep & Mysterious Male)</option>
                        <option value="Zephyr">Zephyr (Smooth & Friendly Female)</option>
                        <option value="Aoede">Aoede (Clear & Professional Female)</option>
                        <option value="Fenrir">Fenrir (Intense & Deep Voice)</option>
                    </select>
                </div>

                <!-- Movie Recap Style Preset -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-400">Cinematic Recap Style (ဇာတ်လမ်းစတိုင်လ်)</label>
                    <select id="recapStyleSelect" class="glass-input w-full p-2.5 rounded-xl text-sm text-zinc-200" onchange="applyStylePreset()">
                        <option value="dramatic">🎬 Dramatic Mystery (ဆန်းကြယ်/စိတ်လှုပ်ရှားစရာ)</option>
                        <option value="action">🔥 Action Thriller (အက်ရှင်/အမြန်ဟုန်ပြင်း)</option>
                        <option value="horror">👻 Horror / Suspense (ထိတ်လန့်စရာ/ခြောက်ခြားဖွယ်)</option>
                        <option value="documentary">🎙️ Deep Documentary (လေးနက်တည်ငြိမ်သော ဇာတ်ကြောင်း)</option>
                    </select>
                </div>

                <!-- Speed Control -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-400">Narration Speed: <span id="speedVal" class="text-brand-400 font-semibold">1.1x</span></label>
                    <div class="grid grid-cols-5 gap-1">
                        <button onclick="setSpeed(0.9)" class="speed-btn py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300">0.9x</button>
                        <button onclick="setSpeed(1.0)" class="speed-btn py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300">1.0x</button>
                        <button onclick="setSpeed(1.1)" class="speed-btn py-1.5 rounded-lg bg-brand-600 border border-brand-500 text-xs text-white font-semibold">1.1x</button>
                        <button onclick="setSpeed(1.2)" class="speed-btn py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300">1.2x</button>
                        <button onclick="setSpeed(1.3)" class="speed-btn py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300">1.3x</button>
                    </div>
                </div>

                <!-- Generate Button -->
                <button onclick="generateGeminiCinematicSpeech()" id="generateBtn" 
                    class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-rose-600 hover:from-brand-500 text-white font-semibold text-sm shadow-lg transition flex items-center justify-center space-x-2">
                    <span>Generate via Google AI Studio</span>
                </button>

                <!-- Status Feedback -->
                <div id="statusBox" class="hidden p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 flex items-center space-x-3">
                    <div class="w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
                    <span id="statusText">Processing Gemini AI Studio request...</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 border border-zinc-700 space-y-4">
            <h3 class="text-base font-bold text-white">Google AI Studio API Key</h3>
            <p class="text-xs text-zinc-400">Google AI Studio မှ ရရှိသော API Key (AIzaSy...) ကို ထည့်သွင်းပါ</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="glass-input w-full p-3 rounded-xl text-sm text-zinc-100">
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeSettingsModal()" class="px-4 py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs">Cancel</button>
                <button onclick="saveApiKey()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-semibold">Save Key</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let currentSpeed = 1.1;

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('ngen_aistudio_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            updateStats();
            document.getElementById('scriptInput').addEventListener('input', updateStats);
        });

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) { localStorage.setItem('ngen_aistudio_api_key', key); closeSettingsModal(); alert('Google AI Studio API Key saved!'); }
        }

        function setSpeed(spd) {
            currentSpeed = spd;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'border-brand-500', 'text-white', 'font-semibold');
                btn.classList.add('bg-zinc-900', 'border-zinc-800', 'text-zinc-300');
                if (btn.textContent.includes(spd + 'x')) {
                    btn.classList.remove('bg-zinc-900', 'border-zinc-800', 'text-zinc-300');
                    btn.classList.add('bg-brand-600', 'border-brand-500', 'text-white', 'font-semibold');
                }
            });
            document.getElementById('speedVal').textContent = spd + 'x';
        }

        function applyStylePreset() {
            const style = document.getElementById('recapStyleSelect').value;
            if (style === 'action') setSpeed(1.2);
            else if (style === 'dramatic') setSpeed(1.05);
            else if (style === 'horror') setSpeed(0.95);
            else if (style === 'documentary') setSpeed(1.0);
        }

        function clearText() { document.getElementById('scriptInput').value = ''; updateStats(); }
        function pasteMovieSample() {
            document.getElementById('scriptInput').value = "ဒီဇာတ်ကားလေးထဲမှာတော့ လူငယ်တစ်ဦးဟာ လျှို့ဝှက်ဆန်းကြယ်တဲ့ အဆောက်အဦးတစ်ခုကို စူးစမ်းရင်း အချိန်ခရီးသွားနိုင်တဲ့ စွမ်းအားကို ရှာဖွေတွေ့ရှိခဲ့ပါတယ်။ ဒါပေမဲ့ အဲဒီနောက်မှာတော့ ထိတ်လန့်စရာ အဖြစ်အပျက်တွေ စတင်ပေါ်ပေါက်လာပါတော့တယ်...";
            updateStats();
        }

        function updateStats() {
            const text = document.getElementById('scriptInput').value;
            const chars = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('charCount').textContent = chars.toLocaleString();
            document.getElementById('wordCount').textContent = words.toLocaleString();
            document.getElementById('estDuration').textContent = Math.round(chars / 15) + 's';
        }

        function showStatus(txt) { document.getElementById('statusBox').classList.remove('hidden'); document.getElementById('statusText').textContent = txt; }
        function hideStatus() { document.getElementById('statusBox').classList.add('hidden'); }

        async function generateGeminiCinematicSpeech() {
            const apiKey = localStorage.getItem('ngen_aistudio_api_key') || document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) { alert('ကျေးဇူးပြု၍ Google AI Studio API Key ထည့်သွင်းပေးပါ။'); openSettingsModal(); return; }

            const script = document.getElementById('scriptInput').value.trim();
            if (!script) { alert('ဇာတ်လမ်းစာသား ထည့်သွင်းရန် လိုအပ်ပါသည်။'); return; }

            const voicePersona = document.getElementById('voicePersonaSelect').value;
            const recapStyle = document.getElementById('recapStyleSelect').value;
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;

            try {
                showStatus(`Connecting to Gemini AI Studio (${voicePersona} / ${recapStyle})...`);

                // Construct prompt instructing Gemini to format or deliver the narration style
                const systemPrompt = `You are an expert movie recap narrator using voice persona '${voicePersona}' with a '${recapStyle}' cinematic style. Format the given Burmese text to sound highly engaging, dramatic, and natural for video voiceover.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: `${systemPrompt}\n\nText to narrate:\n${script}` }] }
                        ]
                    })
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error?.message || `API Error: ${response.status}`);
                }

                const data = await response.json();
                const enhancedText = data.candidates?.[0]?.content?.parts?.[0]?.text || script;

                showStatus("Synthesizing cinematic voice output...");

                // Speech Synthesis with Google AI Studio voice persona configuration
                const utterThis = new SpeechSynthesisUtterance(enhancedText);
                utterThis.rate = currentSpeed;
                
                // Adjust pitch based on persona
                if (voicePersona === 'Charon' || voicePersona === 'Fenrir') {
                    utterThis.pitch = 0.75;
                } else if (voicePersona === 'Puck') {
                    utterThis.pitch = 1.1;
                } else {
                    utterThis.pitch = 1.0;
                }

                utterThis.onend = () => {
                    hideStatus();
                    alert('Google AI Studio Cinematic Speech အောင်မြင်စွာ ပြီးဆုံးပါပြီ။');
                };

                window.speechSynthesis.speak(utterThis);

            } catch (err) {
                console.error(err);
                hideStatus();
                alert('Error: ' + err.message);
            } finally {
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
