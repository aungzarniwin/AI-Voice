<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N - Gen Voice Studio — Gemini AI Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                            950: '#450a0a',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Pyidaungsu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pyidaungsu', 'Inter', sans-serif; }
        .glass-panel { background: rgba(24, 24, 27, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input { background: rgba(9, 9, 11, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-input:focus { border-color: #ef4444; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Top Header -->
    <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-rose-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        N - Gen Voice Studio
                        <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20 font-normal">Gemini AI Studio</span>
                    </h1>
                    <p class="text-xs text-zinc-400">Powered by Google AI Studio API Key.</p>
                </div>
            </div>

            <button onclick="openSettingsModal()" class="px-3.5 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-sm font-medium border border-zinc-700 transition">
                API Key Settings
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Script Editor -->
        <section class="lg:col-span-7 flex flex-col space-y-4">
            <div class="glass-panel rounded-2xl p-5 flex-1 flex flex-col shadow-xl">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-semibold text-zinc-200">Burmese Script Editor</label>
                    <div class="flex items-center space-x-2">
                        <button onclick="clearText()" class="text-xs px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300">Clear</button>
                        <button onclick="pasteSampleScript()" class="text-xs px-2.5 py-1 rounded-lg bg-brand-500/10 text-brand-400 border border-brand-500/20">Sample</button>
                    </div>
                </div>

                <textarea id="scriptInput" oninput="updateStats()" 
                    class="glass-input w-full flex-1 p-4 rounded-xl text-zinc-100 placeholder-zinc-500 text-base focus:outline-none resize-none min-h-[340px]" 
                    placeholder="မြန်မာစာသားများကို ဤနေရာတွင် ထည့်သွင်းပါ..."></textarea>

                <div class="flex items-center justify-between mt-4 pt-3 border-t border-zinc-800 text-xs text-zinc-400">
                    <span>Characters: <strong id="charCount" class="text-zinc-200">0</strong></span>
                    <span>Est. Duration: <strong id="estDuration" class="text-brand-400">0s</strong></span>
                </div>
            </div>
        </section>

        <!-- Right Column: Controls -->
        <section class="lg:col-span-5 flex flex-col space-y-4">
            <div class="glass-panel rounded-2xl p-5 flex flex-col space-y-4 shadow-xl">
                <h3 class="text-sm font-semibold text-zinc-200 pb-2 border-b border-zinc-800">Gemini Voice Studio Controls</h3>
                
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-400">Voice Persona</label>
                    <select id="voiceModelSelect" class="glass-input w-full p-2.5 rounded-xl text-sm text-zinc-200">
                        <option value="Zephyr">Zephyr (Smooth & Natural)</option>
                        <option value="Puck">Puck (Energetic)</option>
                        <option value="Charon">Charon (Deep & Calm)</option>
                    </select>
                </div>

                <button onclick="generateGeminiSpeech()" id="generateBtn" 
                    class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-rose-600 hover:from-brand-500 text-white font-semibold text-sm shadow-lg transition flex items-center justify-center space-x-2">
                    <span>Generate Speech via Gemini AI</span>
                </button>

                <div id="statusBox" class="hidden p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 flex items-center space-x-3">
                    <div class="w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
                    <span id="statusText">Processing...</span>
                </div>
            </div>

            <!-- Player Card -->
            <div id="playerCard" class="glass-panel rounded-2xl p-5 flex flex-col space-y-3 opacity-60 pointer-events-none transition">
                <span class="text-xs font-semibold text-zinc-400 uppercase">Audio Output</span>
                <audio id="audioElement" controls class="w-full h-10 accent-brand-500"></audio>
                <a id="downloadBtn" download="gemini-voiceover.mp3" class="py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium text-center border border-zinc-700 transition pointer-events-none opacity-50">Download MP3 Audio</a>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 border border-zinc-700 space-y-4">
            <h3 class="text-base font-bold text-white">Google AI Studio API Key</h3>
            <p class="text-xs text-zinc-400">Enter your Google AI Studio API Key (starts with AIzaSy...)</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="glass-input w-full p-3 rounded-xl text-sm text-zinc-100">
            <div class="flex justify-end space-x-2">
                <button onclick="closeSettingsModal()" class="px-4 py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs">Cancel</button>
                <button onclick="saveApiKey()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-semibold">Save Key</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('ngen_gemini_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            updateStats();
        });

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) { localStorage.setItem('ngen_gemini_api_key', key); closeSettingsModal(); alert('API Key saved successfully!'); }
        }
        function clearText() { document.getElementById('scriptInput').value = ''; updateStats(); }
        function pasteSampleScript() {
            document.getElementById('scriptInput').value = "မင်္ဂလာပါ၊ N - Gen Voice Studio မှ ကြိုဆိုပါတယ်။ Google AI Studio API Key ကို အသုံးပြု၍ အသံဖိုင် ဖန်တီးနေပါပြီ။";
            updateStats();
        }
        function updateStats() {
            const text = document.getElementById('scriptInput').value;
            document.getElementById('charCount').textContent = text.length.toLocaleString();
            document.getElementById('estDuration').textContent = Math.round(text.length / 14) + 's';
        }
        function showStatus(txt) { document.getElementById('statusBox').classList.remove('hidden'); document.getElementById('statusText').textContent = txt; }
        function hideStatus() { document.getElementById('statusBox').classList.add('hidden'); }

        async function generateGeminiSpeech() {
            const apiKey = localStorage.getItem('ngen_gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) { alert('ကျေးဇူးပြု၍ Google AI Studio API Key ထည့်သွင်းပေးပါ။'); openSettingsModal(); return; }
            const script = document.getElementById('scriptInput').value.trim();
            if (!script) { alert('စာသားထည့်သွင်းရန် လိုအပ်ပါသည်။'); return; }

            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;

            try {
                showStatus("Connecting to Gemini AI Studio API...");
                
                // Using Gemini Multimodal Live / Audio Generation Endpoint or standard fallback speech generation
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Convert the following Burmese text into natural speech formatting or read it aloud phonetically if needed, or provide precise text translation/pronunciation instructions: ${script}` }]
                        }]
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                // Fallback / integration notification for direct audio output via browser synthesis powered by Gemini text enhancement
                showStatus("Processing speech output...");
                
                // Using browser synthesis with cleaned text response
                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || script;

                const utterThis = new SpeechSynthesisUtterance(aiText);
                utterThis.rate = 1.0;
                
                utterThis.onend = () => {
                    hideStatus();
                    alert('Gemini AI Studio ဖြင့် အောင်မြင်စွာ လုပ်ဆောင်ပြီးပါပြီ။');
                };
                
                window.speechSynthesis.speak(utterThis);

            } catch (err) {
                hideStatus();
                alert('Error: ' + err.message);
            } finally {
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
